[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-adoption-scan"
version = "0.2.0"
description = "Scan GitHub organizations for agentic coding tool adoption"
readme = "README.md"
license = {file = "LICENSE.md"}
requires-python = ">=3.11"
authors = [
    {name = "Elliot Murphy", email = "elliot.murphy@posit.co"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "httpx>=0.27",
    "mcp[cli]>=1.0",
    "pyyaml>=6.0",
    "pyarrow>=15.0",
    "click>=8.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
connect = ["posit-sdk>=0.7"]

[project.scripts]
agentic-adoption-scan = "agentic_adoption_scan.cli:main"

[tool.semantic_release]
major_on_zero = false
tag_format = "v{version}"
commit_message = "chore(release): {version}"

[tool.semantic_release.remote]
# Use the SSH deploy key instead of GITHUB_TOKEN for pushing commits/tags,
# so downstream workflows (goreleaser, PyPI publish) are triggered correctly.
ignore_token_for_push = true

[tool.semantic_release.changelog]
generate = true
file = "CHANGELOG.md"
