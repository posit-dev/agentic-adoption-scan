name: MCP Evals

on:
  pull_request:

permissions:
  contents: read

jobs:
  # ─── Layer 2: Inspect AI deterministic + semantic evals ──────────────────
  inspect-evals:
    name: Inspect AI evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # Install the main package (needed by eval tasks) and eval dependencies
      - name: Install dependencies
        run: |
          uv pip install --system -e ".[s3]"
          uv pip install --system -e evals/inspect/

      # ── Deterministic structure evals (no API key needed) ─────────────────
      - name: Run list_indicators_structure eval
        working-directory: evals/inspect
        run: |
          inspect eval mcp_eval_tasks.py \
            --task list_indicators_structure \
            --no-score-display \
            --log-dir /tmp/inspect-logs

      - name: Run list_indicators_schema eval
        working-directory: evals/inspect
        run: |
          inspect eval mcp_eval_tasks.py \
            --task list_indicators_schema \
            --no-score-display \
            --log-dir /tmp/inspect-logs

      # ── Semantic quality evals (needs ANTHROPIC_API_KEY) ──────────────────
      - name: Run list_indicators_quality eval
        if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        working-directory: evals/inspect
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          inspect eval mcp_eval_tasks.py \
            --task list_indicators_quality \
            --model anthropic/claude-haiku-4-5-20251001 \
            --log-dir /tmp/inspect-logs

      # ── Integration evals (needs GITHUB_TOKEN) ────────────────────────────
      - name: Run adoption_agent_eval
        if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        working-directory: evals/inspect
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          inspect eval mcp_eval_tasks.py \
            --task adoption_agent_eval \
            --model anthropic/claude-haiku-4-5-20251001 \
            --log-dir /tmp/inspect-logs

      - name: Upload eval logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspect-eval-logs
          path: /tmp/inspect-logs/
          retention-days: 30
